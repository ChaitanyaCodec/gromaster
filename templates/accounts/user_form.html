{% extends "base.html" %}{% block content %}<div class="row justify-content-center"><div class="col-lg-7"><div class="card"><div class="card-body p-4"><h1 class="h3 fw-bold">Create user</h1><p class="text-secondary">Use their Gmail address and create a separate Gromaster password.</p><form method="post">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>{% endfor %}<button class="btn btn-dark">Create account</button></form></div></div></div></div>{% endblock %}
