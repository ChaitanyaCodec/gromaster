{% extends "base.html" %}{% block content %}<div class="row justify-content-center"><div class="col-md-6"><div class="card"><div class="card-body p-4"><h1 class="h3 fw-bold">Change role</h1><p class="text-secondary">{{ target.email }}</p><form method="post">{% csrf_token %}<select name="role" class="form-select mb-3"><option value="MANAGER" {% if profile.role == "MANAGER" %}selected{% endif %}>Manager</option><option value="ADMIN" {% if profile.role == "ADMIN" %}selected{% endif %}>Admin</option></select><button class="btn btn-dark">Save role</button></form></div></div></div></div>{% endblock %}
